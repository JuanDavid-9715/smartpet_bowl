; SmartPet Bowl — comedero con ESP32-S3
; Compilar con: pio run
; Subir con:    pio run -t upload
[env:esp32s3]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
board_build.arduino.memory_type = qio_opi
lib_deps =
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.0
    bogde/HX711@^0.7.5
    madhephaestus/ESP32Servo@^3.0
    adafruit/Adafruit VL53L0X@^1.3
    adafruit/Adafruit BusIO@^1.16
